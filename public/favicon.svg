<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hw-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0e223d"/>
      <stop offset="60%" stop-color="#081424"/>
      <stop offset="100%" stop-color="#04080f"/>
    </linearGradient>

    <linearGradient id="hw-border" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="hw-sun" x1="36" y1="12" x2="52" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="hw-wind-main" x1="12" y1="36" x2="52" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="hw-wind-top" x1="14" y1="24" x2="42" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <filter id="hw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#hw-bg)" stroke="url(#hw-border)" stroke-width="2"/>

  <!-- Sun orb -->
  <circle cx="44" cy="20" r="7" fill="url(#hw-sun)" filter="url(#hw-glow)"/>

  <!-- Wind streams (Hawaayein motion) -->
  <!-- Upper wind trail curving into sun aura -->
  <path
    d="M14 24.5 H34 C37.5 24.5 40 22.5 40 19.5 C40 16.5 37.5 14.5 34.5 14.5 C31.5 14.5 29.5 16.5 29.5 19"
    stroke="url(#hw-wind-top)"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Center primary wind stream with signature loop -->
  <path
    d="M10 36 H42 C46.5 36 50 39.5 50 44 C50 48.5 46.5 52 42 52 C37.5 52 34 48.5 34 44"
    stroke="url(#hw-wind-main)"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Lower breeze stream -->
  <path
    d="M16 47 H28 C31 47 33 45.2 33 43 C33 40.8 31 39 28.5 39"
    stroke="#7dd3fc"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-opacity="0.85"
  />
</svg>
